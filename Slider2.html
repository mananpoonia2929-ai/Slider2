
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Image Slider</title>

    <style>
        body {
            background-color: #222;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            margin-top: 30px;
        }

        .carousel-container {
            width: 600px;
            max-width: 90%;
            margin: 30px auto;
        }

        .myslides {
            display: none;
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>🍕 Food Image Slider 🍔</h1>

    <div class="carousel-container">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800"
        alt="Pizza">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800"
        alt="Burger">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=800"
        alt="Pasta">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=800"
        alt="Salad">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800"
        alt="Italian Pizza">

        <img class="myslides"
        src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=800"
        alt="Noodles">

    </div>

    <script>

        var index = 0;

        carousel();

        function carousel() {

            var i;

            var x = document.getElementsByClassName("myslides");

            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }

            index++;

            if (index > x.length) {
                index = 1;
            }

            x[index - 1].style.display = "block";

            setTimeout(carousel, 2000);

        }

    </script>

</body>
</html>
